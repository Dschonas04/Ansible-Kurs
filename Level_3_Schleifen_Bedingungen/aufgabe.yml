---
# ================================================================
#  Level 3: Schleifen, Bedingungen, Handler -- AUFGABEN
#  Prüfen mit:  ./pruefen.sh 3
# ================================================================
- name: Level 3
  hosts: uebung
  gather_facts: true
  vars:
    ordner: /tmp/ansible-kurs/level3
    dienste:
      - { name: web, port: 80 }
      - { name: api, port: 8080 }
      - { name: mail, port: 25 }

  tasks:
    - name: Grundverzeichnis
      ansible.builtin.file:
        path: "{{ ordner }}"
        state: directory
        mode: "0755"

    # ── AUFGABE 3.1 ────────────────────────────────────────────
    # Lege mit EINEM Task die Verzeichnisse alpha, beta und gamma an.
    - name: Drei Verzeichnisse
      ansible.builtin.file:
        path: "{{ ordner }}/{{ ___ }}"
        state: directory
        mode: "0755"
      ___:
        - alpha
        - beta
        - gamma

    # ── AUFGABE 3.2 ────────────────────────────────────────────
    # Schreibe für jeden Dienst eine Datei <name>.conf mit dem
    # Inhalt "port = <port>" und einem Zeilenumbruch.
    # Benachrichtige dabei den Handler "Marke setzen".
    - name: Konfigurationen
      ansible.builtin.copy:
        dest: "{{ ordner }}/{{ ___ }}.conf"
        content: "port = {{ ___ }}\n"
        mode: "0644"
      loop: "{{ dienste }}"
      ___: Marke setzen

    # ── AUFGABE 3.3 ────────────────────────────────────────────
    # Schreibe familie.txt mit dem Inhalt "Debian" -- aber nur,
    # wenn os_family wirklich Debian ist.
    - name: Nur auf Debian
      ansible.builtin.copy:
        dest: "{{ ordner }}/familie.txt"
        content: "Debian\n"
        mode: "0644"
      ___: ansible_facts['os_family'] == "Debian"

    # ── AUFGABE 3.4 ────────────────────────────────────────────
    # Sieh nach, ob es web.conf gibt, und merke dir das Ergebnis.
    - name: Nachsehen
      ansible.builtin.___:
        path: "{{ ordner }}/web.conf"
      ___: web

    # ── AUFGABE 3.5 ────────────────────────────────────────────
    # Schreibe groesse.txt mit der Größe von web.conf in Bytes --
    # nur, wenn die Datei existiert.
    - name: Größe festhalten
      ansible.builtin.copy:
        dest: "{{ ordner }}/groesse.txt"
        content: "{{ ___ }}\n"
        mode: "0644"
      when: ___

  handlers:
    # ── AUFGABE 3.6 ────────────────────────────────────────────
    # Der Handler schreibt marke.txt mit "geaendert".
    - name: ___
      ansible.builtin.copy:
        dest: "{{ ordner }}/marke.txt"
        content: "geaendert\n"
        mode: "0644"
