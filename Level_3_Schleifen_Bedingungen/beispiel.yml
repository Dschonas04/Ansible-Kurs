---
# Level 3: Schleifen, Bedingungen, Handler.
- name: Schleifen und Handler
  hosts: uebung
  gather_facts: true
  vars:
    ordner: /tmp/ansible-kurs-beispiel3
    dienste:
      - { name: web, port: 80 }
      - { name: api, port: 8080 }

  tasks:
    - name: Grundverzeichnis
      ansible.builtin.file:
        path: "{{ ordner }}"
        state: directory
        mode: "0755"

    - name: Ein Task, drei Verzeichnisse
      ansible.builtin.file:
        path: "{{ ordner }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [eins, zwei, drei]

    - name: Schleife über Wörterbücher
      ansible.builtin.copy:
        dest: "{{ ordner }}/{{ item.name }}.conf"
        content: "port = {{ item.port }}\n"
        mode: "0644"
      loop: "{{ dienste }}"
      notify: Neustart vormerken

    - name: Nur auf Debian-artigen Systemen
      ansible.builtin.debug:
        msg: "Hier läuft {{ ansible_facts['distribution'] }}"
      when: ansible_facts['os_family'] == "Debian"

    - name: Nachsehen
      ansible.builtin.stat:
        path: "{{ ordner }}/web.conf"
      register: web

    - name: Ergebnis der Prüfung
      ansible.builtin.debug:
        msg: "web.conf ist {{ web.stat.size }} Bytes groß"
      when: web.stat.exists

  handlers:
    - name: Neustart vormerken
      ansible.builtin.copy:
        dest: "{{ ordner }}/neustart.marke"
        content: "Konfiguration hat sich geändert\n"
        mode: "0644"
