---
# ================================================================
#  Level 4: Rollen -- AUFGABEN
#  Dies ist die Aufgabe. Ersetze jedes ___.
#  Prüfen mit:  ./pruefen.sh 4
# ================================================================

# ── AUFGABE 4.1 ────────────────────────────────────────────────
# Lege das Verzeichnis der Rolle an (Vorgabewert aus defaults).
- name: Verzeichnis der Rolle
  ansible.builtin.file:
    path: "{{ ___ }}"
    state: directory
    mode: "0755"

# ── AUFGABE 4.2 ────────────────────────────────────────────────
# Fülle die Vorlage dienst.conf.j2 nach <ordner>/dienst.conf.
# In einer Rolle genügt der reine Dateiname als src.
- name: Konfiguration schreiben
  ansible.builtin.template:
    src: ___
    dest: "{{ kursdienst_ordner }}/dienst.conf"
    mode: "0644"
  ___: Dienst neu starten

# ── AUFGABE 4.3 ────────────────────────────────────────────────
# Schreibe name.txt mit dem Namen des Dienstes.
- name: Namen festhalten
  ansible.builtin.copy:
    dest: "{{ kursdienst_ordner }}/name.txt"
    content: "{{ ___ }}\n"
    mode: "0644"
