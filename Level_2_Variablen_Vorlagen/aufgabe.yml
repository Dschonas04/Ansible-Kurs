---
# ================================================================
#  Level 2: Variablen, Fakten, Vorlagen -- AUFGABEN
#  Prüfen mit:  ./pruefen.sh 2
# ================================================================
- name: Level 2
  hosts: uebung
  gather_facts: ___          # AUFGABE 2.1: Fakten brauchst du unten
  vars:
    ordner: /tmp/ansible-kurs/level2
    dienst_name: kursdienst
    dienst_port: 9090
    knoten:
      - alpha
      - beta
      - gamma

  tasks:
    - name: Verzeichnis
      ansible.builtin.file:
        path: "{{ ordner }}"
        state: directory
        mode: "0755"

    # ── AUFGABE 2.2 ────────────────────────────────────────────
    # Schreibe die Datei namen.txt mit den Knoten, durch Komma und
    # Leerzeichen getrennt, in GROSSBUCHSTABEN, gefolgt von einem
    # Zeilenumbruch. Erwartet: "ALPHA, BETA, GAMMA"
    - name: Knoten als Text
      ansible.builtin.copy:
        dest: "{{ ordner }}/namen.txt"
        content: "{{ knoten | ___ | ___ }}\n"
        mode: "0644"

    # ── AUFGABE 2.3 ────────────────────────────────────────────
    # Schreibe anzahl.txt mit der Anzahl der Knoten (nur die Zahl).
    - name: Anzahl
      ansible.builtin.copy:
        dest: "{{ ordner }}/anzahl.txt"
        content: "{{ knoten | ___ }}\n"
        mode: "0644"

    # ── AUFGABE 2.4 ────────────────────────────────────────────
    # Schreibe rechner.txt mit dem Hostnamen aus den Fakten.
    - name: Hostname
      ansible.builtin.copy:
        dest: "{{ ordner }}/rechner.txt"
        content: "{{ ___ }}\n"
        mode: "0644"

    # ── AUFGABE 2.5 ────────────────────────────────────────────
    # Fülle die Vorlage dienst.conf.j2 (sie liegt neben diesem Playbook)
    # nach {{ ordner }}/dienst.conf. Welches Modul ist das richtige?
    - name: Vorlage füllen
      ansible.builtin.___:
        src: dienst.conf.j2
        dest: "{{ ordner }}/dienst.conf"
        mode: "0644"

    # ── AUFGABE 2.6 ────────────────────────────────────────────
    # port.txt soll den Port enthalten -- aber aus einer Variablen,
    # die es NICHT gibt, mit 8080 als Vorgabe.
    - name: Vorgabewert
      ansible.builtin.copy:
        dest: "{{ ordner }}/port.txt"
        content: "{{ nicht_gesetzter_port | ___ }}\n"
        mode: "0644"
