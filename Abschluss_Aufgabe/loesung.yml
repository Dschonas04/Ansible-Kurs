---
- name: Abschluss
  hosts: uebung
  gather_facts: true
  vars:
    ordner: /tmp/ansible-kurs/abschluss
    dienste:
      - { name: web, port: 80, aktiv: true }
      - { name: api, port: 8080, aktiv: true }
      - { name: alt, port: 8081, aktiv: false }

  tasks:
    - name: Grundverzeichnis
      ansible.builtin.file:
        path: "{{ ordner }}"
        state: directory
        mode: "0755"

    - name: Ein Verzeichnis je Dienst
      ansible.builtin.file:
        path: "{{ ordner }}/{{ item.name }}"
        state: directory
        mode: "0755"
      loop: "{{ dienste }}"

    - name: Konfiguration je aktivem Dienst
      ansible.builtin.template:
        src: dienst.conf.j2
        dest: "{{ ordner }}/{{ item.name }}/dienst.conf"
        mode: "0644"
      loop: "{{ dienste }}"
      when: item.aktiv
      notify: Auslieferung vermerken

    - name: Übersicht der aktiven Dienste
      ansible.builtin.copy:
        dest: "{{ ordner }}/uebersicht.txt"
        content: >-
          {{ dienste | selectattr('aktiv') | map(attribute='name') | join(', ') }}
        mode: "0644"

  handlers:
    - name: Auslieferung vermerken
      ansible.builtin.copy:
        dest: "{{ ordner }}/ausgeliefert.txt"
        content: "fertig\n"
        mode: "0644"
